version: '3.8'

services:
  backend:
    build: .
    container_name: privacy-shield-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./Base.csv:/app/Base.csv
    environment:
      - BACKEND_DEBUG=false
      - DATASET_PATH=/app/Base.csv
      - DATASET_SAMPLE_SIZE=10000
      - ML_RANDOM_SEED=42
    command: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: node:18-alpine
    container_name: privacy-shield-frontend
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    command: sh -c "npm install && npm start"

  # Optional: Development helper
  demo:
    build: .
    container_name: privacy-shield-demo
    volumes:
      - ./:/app
      - ./data:/app/data
      - ./Base.csv:/app/Base.csv
    environment:
      - PYTHONUNBUFFERED=1
    command: python demo.py

volumes:
  data:
  logs:
